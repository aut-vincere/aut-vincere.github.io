<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <title>Lenni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@400,500;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/styles.min.css" />

</head>


<body class="body">

  <header class="page-header">
    <div class="page-header__container">
      <a class="page-header__logo" href="#">
        <img class="page-header__logo-icon" src="/assets/images/logo.svg" alt="logo" />
      </a>
      <nav class="page-header__nav">
        <a class="page-header__nav-link" href="#">Мероприятия</a>
        <a class="page-header__nav-link" href="#">Блог</a>
        <a class="page-header__nav-link" href="#">О нас</a>
        <a class="page-header__nav-link" href="#">Контакты</a>
      </nav>
      <div class="page-header__right-block">
        <a class="page-header__user-link btn" href="#">Войти</a>
      </div>

    </div>

  </header>

  <main class="main">
    <div class="events">
      <section class="listing events__listing">
        <h2 class="listing__section-title section-title">Мероприятия</h2>
        <div class="listing__events-list">
          <!--prettier-ignore-->
          <article class="event-card listing__event-card listing__event-card">
            <a href="#" class="event-card__link">
              <picture class="event-card__picture">
                <img src="/assets/images/nirvana.jpg" alt="nirvana" class="event-card__img" />
              </picture>
              <h4 class="event-card__title">Собираемся и слушаем альбом Nirvana. Nirvana</h4>
              <p class="event-card__description">Это третий альбом группы, выпущенный после смерти Курта Кобейна и первый, содержащий студийный материал.</p>
              <time datetime="2024-12-07T18:00" class="event-card__time">07.12.2024 | начало 18.00</time>
            </a>
          </article>



        </div>

      </section>
    </div>

    <article class="event">
      <form class="reserve event__reserve">
        <div class="reserve__checks">
          Чекбоксы
        </div>
        <div class="reserve__scheme">
          Схема столов
        </div>
        <div class="reserve__order">
          Оформление заказа
        </div>
        <div class="reserve__legend">
          Легенда
        </div>
      </form>
    </article>
  </main>
  <footer class="page-footer">
    footer
  </footer>

</body>

</html>
